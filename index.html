<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anemia Heal Tracker - Login</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩸</text></svg>">
    <link rel="stylesheet" href="./output.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-10">
    <div id="login-container" class="max-w-md mx-auto mt-20 px-4">
        <div class="bg-white p-8 rounded-xl shadow-md border border-slate-100">
            <h2 class="text-2xl font-bold text-rose-600 mb-6 text-center" data-i18n="loginTitle">Login</h2>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-slate-700 font-medium mb-1" data-i18n="email">Email</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-500" dir="ltr">
                </div>
                <div>
                    <label class="block text-slate-700 font-medium mb-1" data-i18n="password">Password</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-500" dir="ltr">
                </div>
                <p id="login-error" class="text-red-500 text-sm hidden"></p>
                <button type="submit" class="w-full bg-rose-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-rose-700 transition" data-i18n="loginBtn">Enter</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { auth, migrateUserData } from './js/firebase-init.js';
        import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await migrateUserData(user.uid);
                window.location.href = 'dashboard.html';
            }
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            loginError.classList.add('hidden');
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            signInWithEmailAndPassword(auth, email, password)
                .catch((error) => {
                    loginError.innerText = "فشل Login: " + error.message;
                    loginError.classList.remove('hidden');
                });
        });
    </script>
</body>
</html>
