<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anemia Heal Tracker - Settings</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩸</text></svg>">
    <link rel="stylesheet" href="./output.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-10">
    <main class="max-w-4xl mx-auto mt-6 px-4 space-y-8">
        
        <!-- Toast -->
        <div id="toast" class="fixed bottom-4 end-4 bg-green-600 text-white px-4 py-2 rounded shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2 font-bold">
            <span>✓</span> <span data-i18n="saved">Saved</span>
        </div>

        <h2 class="text-2xl font-bold text-slate-800" data-i18n="settingsTitle">Settings</h2>

        <!-- Profile & Appearance -->
        <form id="profile-form" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 space-y-4">
                    <h3 class="font-bold text-slate-700 flex items-center gap-2"><span>👤</span> <span data-i18n="profileSettings">Profile & Treatment</span></h3>
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-1" data-i18n="medName">Medication / Supplement Name</label>
                        <input type="text" id="set-med-name" class="w-full border border-slate-200 rounded-lg p-2 text-sm focus:ring-2 focus:ring-rose-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-1" data-i18n="doseTarget">Daily Target (Doses)</label>
                        <input type="number" id="set-dose-target" min="1" max="5" class="w-full border border-slate-200 rounded-lg p-2 text-sm focus:ring-2 focus:ring-rose-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-1" data-i18n="startDate">Treatment Start Date</label>
                        <input type="date" id="set-start-date" class="w-full border border-slate-200 rounded-lg p-2 text-sm focus:ring-2 focus:ring-rose-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-1" data-i18n="goalDays">Treatment Goal (Days)</label>
                        <input type="number" id="set-goal-days" min="1" class="w-full border border-slate-200 rounded-lg p-2 text-sm focus:ring-2 focus:ring-rose-500">
                    </div>
                </div>

                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 space-y-4">
                    <h3 class="font-bold text-slate-700 flex items-center gap-2"><span>🎨</span> <span data-i18n="appearanceSettings">Appearance & Language</span></h3>
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-1" data-i18n="language">Language</label>
                        <select id="set-language" class="w-full border border-slate-200 rounded-lg p-2 text-sm focus:ring-2 focus:ring-rose-500 bg-white">
                            <option value="ar">العربية (Arabic)</option>
                            <option value="en">English (الإنجليزية)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-1" data-i18n="theme">Theme</label>
                        <select id="set-theme" class="w-full border border-slate-200 rounded-lg p-2 text-sm focus:ring-2 focus:ring-rose-500 bg-white">
                            <option value="light" data-i18n="themeLight">Light</option>
                            <option value="dark" data-i18n="themeDark">Dark</option>
                        </select>
                    </div>
                    
                    <hr class="my-2 border-slate-100">
                    <h3 class="font-bold text-slate-700 flex items-center gap-2"><span>🔔</span> <span data-i18n="remindersTitle">Reminders</span></h3>
                    <div>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="set-reminders" class="w-4 h-4 accent-rose-500">
                            <span class="text-sm font-bold text-slate-700" data-i18n="enableReminders">Enable Reminders (Local)</span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="flex justify-end">
                <button type="submit" id="btn-save-profile" class="bg-rose-600 hover:bg-rose-700 text-white font-bold px-6 py-2.5 rounded-lg shadow-sm transition flex items-center gap-2 text-sm">
                    <span>💾</span> <span data-i18n="saveProfile">Save Settings</span>
                </button>
            </div>
        </form>

        <!-- Meal Slots Manager -->
        <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-slate-700 flex items-center gap-2"><span>⏱️</span> <span data-i18n="scheduleManager">Meals & Schedule Manager</span></h3>
                <button id="btn-add-slot" class="text-sm bg-rose-50 text-rose-600 px-3 py-1 rounded font-bold hover:bg-rose-100 transition" data-i18n="addSlot">+ Add Meal</button>
            </div>
            <div id="slots-container" class="space-y-3">
                <!-- Slots injected here -->
            </div>
        </section>

        <!-- Lab Results -->
        <section id="lab-entry" class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
            <h3 class="font-bold text-slate-700 flex items-center gap-2 mb-4"><span>🧪</span> <span data-i18n="labResultsEntry">Lab Results Entry</span></h3>
            
            <form id="lab-form" class="bg-slate-50 p-4 rounded-lg border border-slate-200 mb-6 flex flex-wrap gap-4 items-end">
                <div class="flex-1 min-w-[120px]">
                    <label class="block text-xs font-bold text-slate-500 mb-1" data-i18n="date">Date</label>
                    <input type="date" id="lab-date" required class="w-full border border-slate-200 rounded p-2 text-sm focus:ring-2 focus:ring-rose-500">
                </div>
                <div class="w-24 min-w-[80px]">
                    <label class="block text-xs font-bold text-slate-500 mb-1">Hb (g/dL)</label>
                    <input type="number" id="lab-hb" step="any" class="w-full border border-slate-200 rounded p-2 text-sm focus:ring-2 focus:ring-rose-500" placeholder="10.5">
                </div>
                <div class="w-24 min-w-[80px]">
                    <label class="block text-xs font-bold text-slate-500 mb-1">Ferritin</label>
                    <input type="number" id="lab-fer" step="any" class="w-full border border-slate-200 rounded p-2 text-sm focus:ring-2 focus:ring-rose-500" placeholder="8">
                </div>
                <div class="flex-2 min-w-[150px]">
                    <label class="block text-xs font-bold text-slate-500 mb-1" data-i18n="notes">Notes</label>
                    <input type="text" id="lab-notes" class="w-full border border-slate-200 rounded p-2 text-sm focus:ring-2 focus:ring-rose-500" data-i18n-placeholder="notesPlaceholderLab" placeholder="Fasting, etc...">
                </div>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-bold transition h-10" data-i18n="saveResult">Save</button>
            </form>

            <div class="overflow-x-auto">
                <table class="w-full text-sm text-start">
                    <thead class="text-xs text-slate-500 bg-slate-50 uppercase">
                        <tr>
                            <th class="px-4 py-3 text-start rounded-s-lg" data-i18n="date">Date</th>
                            <th class="px-4 py-3 text-start">Hemoglobin</th>
                            <th class="px-4 py-3 text-start">Ferritin</th>
                            <th class="px-4 py-3 text-start" data-i18n="notes">Notes</th>
                            <th class="px-4 py-3 rounded-e-lg w-10"></th>
                        </tr>
                    </thead>
                    <tbody id="lab-table-body" class="divide-y divide-slate-100">
                        <!-- Lab rows injected here -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>
    <script type="module">
        import { requireAuth } from './js/auth-guard.js';
        import { injectNav } from './js/nav.js';
        import { initSettings } from './js/settings.js';

        requireAuth((user) => {
            injectNav('settings');
            initSettings(user.uid);
        });
    </script>
</body>
</html>
