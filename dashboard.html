<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anemia Heal Tracker - Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩸</text></svg>">
    <link rel="stylesheet" href="./output.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-10">
    <main class="max-w-4xl mx-auto mt-6 px-4 space-y-8">
        <div class="flex justify-between items-center">
            <h2 class="text-2xl font-bold text-slate-800" data-i18n="dashboardTitle">Dashboard</h2>
            <button id="btn-export" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-bold transition flex items-center gap-2">
                <span>📥</span> <span data-i18n="exportData">Export Data</span>
            </button>
        </div>

        <!-- Adherence & Streak & Countdown -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Ring -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex flex-col items-center justify-center">
                <h3 class="font-bold text-slate-600 mb-4" data-i18n="adherenceWeek">This Week's Adherence</h3>
                <div class="relative w-32 h-32">
                    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="40" fill="transparent" stroke="#f1f5f9" stroke-width="10"></circle>
                        <circle id="adherence-ring" cx="50" cy="50" r="40" fill="transparent" stroke="#e11d48" stroke-width="10" stroke-dasharray="251.2" stroke-dashoffset="251.2" stroke-linecap="round" class="transition-all duration-1000 ease-out"></circle>
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center">
                        <span id="adherence-text" class="text-2xl font-bold text-rose-600">0%</span>
                    </div>
                </div>
            </div>

            <!-- Streak -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex flex-col items-center justify-center">
                <h3 class="font-bold text-slate-600 mb-4" data-i18n="currentStreak">Streak</h3>
                <div class="text-5xl font-bold text-orange-500 mb-2 flex items-center gap-2">
                    <span>🔥</span>
                    <span id="streak-current">0</span>
                </div>
                <p class="text-sm text-slate-500"><span data-i18n="bestStreak">Best:</span> <span id="streak-best" class="font-bold">0</span></p>
            </div>

            <!-- Countdown -->
            <div id="countdown-card" class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex flex-col items-center justify-center hidden">
                <h3 class="font-bold text-slate-600 mb-4" data-i18n="treatmentProgress">Treatment Progress</h3>
                <div class="text-3xl font-bold text-rose-600 mb-2" id="countdown-days"></div>
                <p class="text-sm text-slate-500" id="countdown-date"></p>
            </div>
        </div>

        <!-- Heatmap & Bar Chart -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <!-- Heatmap -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                <h3 class="font-bold text-slate-600 mb-4" data-i18n="historyHeatmap">History Heatmap</h3>
                <div id="heatmap-grid" class="grid grid-cols-7 gap-1"></div>
                <div class="flex items-center gap-2 mt-4 text-xs text-slate-500 justify-end">
                    <span data-i18n="less">Less</span>
                    <div class="w-3 h-3 rounded-sm bg-slate-100"></div>
                    <div class="w-3 h-3 rounded-sm bg-red-400"></div>
                    <div class="w-3 h-3 rounded-sm bg-orange-400"></div>
                    <div class="w-3 h-3 rounded-sm bg-green-500"></div>
                    <span data-i18n="more">More</span>
                </div>
            </div>
            
            <!-- Bar Chart -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                <h3 class="font-bold text-slate-600 mb-4" data-i18n="weeklyAvg">Weekly Average</h3>
                <div class="h-40 flex items-end justify-between gap-2" id="bar-chart-container">
                    <!-- Bars injected here -->
                </div>
            </div>
        </div>

        <!-- Lab Results -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-slate-600" data-i18n="labTrends">Lab Results</h3>
                <a href="settings.html#lab-entry" class="text-sm text-rose-600 hover:underline" data-i18n="addLabResult">+ + Add Result</a>
            </div>
            <div id="lab-empty" class="text-center py-8 text-slate-400 text-sm hidden" data-i18n="noLabData">
                No data logged yet.
            </div>
            <div id="lab-chart-container" class="relative w-full h-64">
                <!-- SVG injected via JS -->
            </div>
        </div>

        <!-- Day Detail Modal -->
        <div id="day-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
            <div class="bg-white rounded-xl shadow-lg max-w-sm w-full p-6 relative">
                <button id="close-modal" class="absolute top-4 end-4 text-slate-400 hover:text-slate-600">✕</button>
                <h3 class="text-lg font-bold text-slate-800 mb-4" id="modal-date"></h3>
                <div class="space-y-4">
                    <div>
                        <h4 class="text-sm font-bold text-slate-500 mb-1" data-i18n="dosesTakenLabel">Doses Taken:</h4>
                        <p class="font-medium" id="modal-doses"></p>
                    </div>
                    <div>
                        <h4 class="text-sm font-bold text-slate-500 mb-1" data-i18n="symptomsSummary">Symptoms:</h4>
                        <div class="text-sm grid grid-cols-2 gap-2">
                            <div><span data-i18n="energy">Energy</span>: <span id="modal-energy"></span>/5</div>
                            <div><span data-i18n="nausea">Nausea</span>: <span id="modal-nausea"></span>/5</div>
                            <div><span data-i18n="dizziness">Dizziness</span>: <span id="modal-dizziness"></span>/5</div>
                        </div>
                    </div>
                    <div>
                        <h4 class="text-sm font-bold text-slate-500 mb-1" data-i18n="notes">Notes:</h4>
                        <p class="text-sm text-slate-600" id="modal-notes"></p>
                    </div>
                </div>
            </div>
        </div>

    </main>
    <script type="module">
        import { requireAuth } from './js/auth-guard.js';
        import { injectNav } from './js/nav.js';
        import { initDashboard } from './js/dashboard.js';

        requireAuth((user) => {
            injectNav('dashboard');
            initDashboard(user.uid);
        });
    </script>
</body>
</html>
